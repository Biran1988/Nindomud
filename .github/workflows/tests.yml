name: NindoMUD tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source
        run: python -m py_compile *.py
      - name: Run tests
        run: python -m unittest discover -p "test_*.py"
      - name: Run end-to-end smoke suite
        run: python test_smoke.py
