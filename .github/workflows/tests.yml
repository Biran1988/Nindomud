name: NindoMUD tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source
        run: python -m py_compile *.py
      - name: Run tests
        run: python -m unittest discover -p "test_*.py"
      - name: Run end-to-end smoke suite
        run: python test_smoke.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build current source ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path(".")
          target = Path("Nindo_mud.zip")
          excluded = {".git", "data", "__pycache__", ".pytest_cache", "dist"}
          allowed = {".py", ".md", ".yml", ".yaml", ".txt", ".html", ".json"}
          with ZipFile(target, "w", ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if not path.is_file() or path == target:
                      continue
                  if any(part in excluded or part.startswith("data_test") for part in path.parts):
                      continue
                  if path.suffix in allowed or path.name == ".gitignore":
                      archive.write(path, path.as_posix())
          print(f"Created {target}: {target.stat().st_size} bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Nindo_mud
          path: Nindo_mud.zip
          retention-days: 30
