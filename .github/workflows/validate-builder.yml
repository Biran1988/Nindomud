name: Validate Nindo_mud and package source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python regression tests
        run: python3 -m unittest discover -p 'test_*.py'
      - name: Build Nindo_mud release archive
        run: python3 scripts/build_release.py dist
      - name: Upload latest Nindo_mud zip
        uses: actions/upload-artifact@v4
        with:
          name: Nindo_mud
          path: dist/Nindo_mud.zip
          if-no-files-found: error
